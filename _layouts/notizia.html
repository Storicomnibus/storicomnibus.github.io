---
layout: default
---
<article class="contenitore stretto pagina">
  <p class="data">{{ page.date | date: "%d/%m/%Y" }}</p>
  <h1>{{ page.title }}</h1>
  {% if page.immagine %}<img class="immagine-pagina" src="{{ page.immagine | relative_url }}" alt="">{% endif %}
  <div class="testo">{{ content }}</div>
  <p><a href="{{ '/notizie/' | relative_url }}">← Tutte le notizie</a></p>
</article>
