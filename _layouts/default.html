<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} – {% endif %}{{ site.data.sito.nome }}</title>
  <meta name="description" content="{{ page.descrizione | default: page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/stile.css' | relative_url }}">
</head>
<body>
  {% include intestazione.html %}
  <main>
    {{ content }}
  </main>
  {% include piede.html %}
  <script src="{{ '/assets/js/galleria.js' | relative_url }}" defer></script>
</body>
</html>
